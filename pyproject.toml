[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "tempylite"
version = "0.1.0"
description = "簡易的なテンプレートエンジン"
requires-python = ">=3.9"
dependencies = ["tomli>=1.1; python_version < '3.11'"]

[project.scripts]
tempylite = "tempylite.cli:main"

[tool.setuptools]
packages = ["tempylite"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
